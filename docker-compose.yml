version: '3.8'

# Docker Compose automatically loads .env file from the same directory
# Environment variables can be referenced using ${VARIABLE_NAME} syntax
# Default values can be provided using ${VARIABLE_NAME:-default_value}

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: zpw-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zpw_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zpw_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-zpw_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"  # If port conflict, change to "15432:5432" and update DATABASE_URL
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Mount init scripts if needed
      - ./backend/db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zpw_user -d zpw_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - zpw-network
    restart: unless-stopped

  # Redis for caching and rate limiting
  redis:
    image: redis:7-alpine
    container_name: zpw-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"  # If port conflict, change to "16379:6379" and update REDIS_URL
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - zpw-network
    restart: unless-stopped

  # Frontend (Vite Dev Server)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: zpw-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"  # If port conflict, change to "15173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules  # Prevent host node_modules from overwriting container dependencies
    environment:
      - NODE_ENV=development
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5173"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - zpw-network
    restart: unless-stopped

  # Backend Tests Service
  backend-tests:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: deps
    container_name: zpw-backend-tests
    volumes:
      - ./backend:/app
      - /app/node_modules  # Prevent host node_modules from overwriting container dependencies
    environment:
      - NODE_ENV=test
      - SKIP_AUTH=true
      - DATABASE_URL=postgresql://${POSTGRES_USER:-zpw_user}:${POSTGRES_PASSWORD:-zpw_dev_password}@postgres:5432/${POSTGRES_DB:-zpw_db}
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - zpw-network
    profiles:
      - test  # Only start with --profile test
    command: sh -c "npm ci && npx tsx scripts/run-migrations.ts && npm test -- --run"

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  zpw-network:
    driver: bridge

